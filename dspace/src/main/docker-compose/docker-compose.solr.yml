name: solr-dspace

services:
  dspace-solr:
    container_name: solr-dspace
    image: dspace-solr
    build:
      context: ../../../..
      dockerfile: dspace/src/main/docker/dspace-solr/Dockerfile
      additional_contexts:
        solrconfigs: ../../../solr
    restart: unless-stopped
    ports:
      - "${SOLR_PORT:-8983}:8983"
    environment:
      SOLR_HEAP: "${SOLR_HEAP:-2g}"
      SOLR_OPTS: >-
        -Dsolr.config.lib.enabled=true
        -Dsolr.allowUrls=localhost:8983/solr
        -Dsolr.logs.dir=/var/solr/logs
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Xlog:gc*:stdout
    working_dir: /var/solr/data
    volumes:
      - "${SOLR_DATA_DIR:-/var/solr}:/var/solr"
    # Initialization needs root to populate the bind mount; Solr itself runs
    # as the unprivileged solr user after the files are owned correctly.
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
        init-var-solr
        for core in authority oai search statistics qaevent suggestion audit; do
          precreate-core "$$core" "/opt/solr/server/solr/configsets/$$core"
          cp -r "/opt/solr/server/solr/configsets/$$core/." "$$core/"
        done
        chown -R solr:solr /var/solr
        exec runuser -u solr -- solr-foreground
