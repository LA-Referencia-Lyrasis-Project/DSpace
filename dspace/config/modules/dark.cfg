#---------------------------------------------------------------#
#---------------------- dARK CONFIGURATION ---------------------#
#---------------------------------------------------------------#

# Enable dARK minting and registration for new Items.
# Restart DSpace after changing this setting.
identifier.dark.enabled = true

# Complete base URL of the dARK minter API, including any required path prefix.
# No /api/v1 suffix is appended automatically.
identifier.dark.minter-api-url = http://localhost:8001/api/v1

# Number of Items reserved per API call when running bin/dspace dark --mint-all.
identifier.dark.batch-size = 100

# Authority and NAAN must be provisioned in the dARK platform before DSpace mints dARKs.
identifier.dark.authority-id = platform-demo-1788435035
identifier.dark.naan = 12345

# Optional bearer token if the deployed dARK API is fronted by an HTTP auth layer.
#identifier.dark.api-token =

# Local development profile can identify the authority with this header.
# This legacy header is retained for older installations in unsigned mode.
# The current Minter also receives X-DARK-Authority-Id. DARK2 signing supplies
# its own authority header, independently of this legacy switch.
identifier.dark.authority-header.enabled = true
identifier.dark.authority-header = X-Authority-Id

# Metadata field used to expose the minted dARK on the Item.
# The stored value is the bare dARK identifier, e.g. ark:12345/2000000004k.
identifier.dark.metadata = dc.identifier.dark


# Target URL used when the Item has no Handle yet.
# Supported variables: {uuid}, {handle}
identifier.dark.target-url-pattern = ${dspace.ui.url}/items/{uuid}

# Item metadata fields used to build dARK Level 1 and OAI-DC Level 2 metadata.
# Fields can be a comma-separated fallback list. Required-field validation is
# performed by the dARK Minter, and its response is stored in dark.last_error.
identifier.dark.metadata.title = dc.title
identifier.dark.metadata.creator = dc.creator, dc.contributor.author, dc.contributor
identifier.dark.metadata.date = dc.date, dc.date.issued
identifier.dark.metadata.publisher = dc.publisher
identifier.dark.metadata.type = dc.type
identifier.dark.metadata.language = dc.language.iso
identifier.dark.metadata.abstract = dc.description.abstract
identifier.dark.metadata.subject = dc.subject

identifier.dark.metadata.schema = oai_dc
identifier.dark.metadata.media-type = application/xml

# Network timeouts (milliseconds) for every request to the Minter. Non-positive values fall back to the defaults.
# A timeout on a signed modification means its outcome is UNKNOWN: reconcile before resending.
#identifier.dark.connect-timeout-ms = 10000
#identifier.dark.read-timeout-ms = 90000

# DARK2 Ed25519 request authentication. Opt-in; existing workflows remain unsigned.
# Generate using bin/dspace dark-auth --generate and register ONLY the public key
# with the Minter administrator before enabling. Restart after configuration changes.
# Confirm the current public fingerprint, authority and destination in the admin UI
# before signed modifications are allowed.
identifier.dark.auth.enabled = false
# Must be an immediate child of ${dspace.dir}/keys, outside web-accessible content.
# Use a NEW directory name for coordinated rotation; existing keys are never overwritten.
identifier.dark.auth.key-directory = ${dspace.dir}/keys/dark
