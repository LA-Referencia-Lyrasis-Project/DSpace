# -----------------------------------------------------------------------
# embeddings.cfg
#
# OpenAI-compatible embedding endpoint settings used for Solr vector
# indexing and semantic search.
# -----------------------------------------------------------------------

# Enable semantic search and embedding generation/indexing
semantic.search.enabled = false

# Enable hybrid search and embedding generation/indexing
hybrid.search.enabled = false

# Embedding model used for indexing and search embeddings
embeddings.model = bge-m3

# OpenAI-compatible endpoint for indexing (e.g. local service or Ollama-compatible proxy)
embeddings.api.url.indexing = http://localhost:11434/v1/embeddings

# Title field used as text source during indexing (schema.element[.qualifier])
embeddings.indexing.title.field = dc.title

# Additional metadata fields used as text sources during indexing.
# Supports comma-separated values, e.g. dc.description.abstract, dc.subject
embeddings.indexing.additional.fields = dc.description.abstract, dc.subject

# OpenAI-compatible endpoint for search-time embedding generation
embeddings.api.url.search = http://localhost:11434/v1/embeddings

# API key for indexing-time embedding generation
embeddings.api.key.indexing =

# API key for search-time embedding generation
embeddings.api.key.search =

# Optional encoding format sent to embedding providers (e.g. float, base64)
embeddings.encoding.format = float

# Max tokens per chunk for embedding segmentation
embeddings.max.segment.size.tokens = 128

# Token overlap between adjacent chunks
embeddings.max.overlap.size.tokens = 0

# Maximum number of chunks generated from description/abstract text
embeddings.max.chunks.size = 5

# Expected vector size returned by the model
embeddings.vector.dimension = 1024

# HTTP timeout for embedding requests in milliseconds
embeddings.api.timeout.ms = 10000

# Max retry attempts for transient embedding API failures (includes first try)
embeddings.api.retry.max.attempts = 3

# Base backoff delay in milliseconds for embedding API retries
embeddings.api.retry.delay.ms = 500

# Number of nearest neighbors requested in semantic search used by knn query parser
embeddings.search.topK = 10

# Number of nearest neighbors requested in hybrid search
embeddings.hybrid.topK = 10

# Reciprocal Rank Fusion K parameter used by hybrid search
embeddings.hybrid.rrf.k = 60

# Selects the Solr vector field used by indexing/search (false -> vector, true -> vector_multivalued)
embeddings.solr.multi.vectors = false

# Semantic query parser. Supported: knn, vectorSimilarity
embeddings.search.query.parser = vectorSimilarity

# Similarity threshold used by vectorSimilarity query parser
embeddings.search.min.return = 0.7
